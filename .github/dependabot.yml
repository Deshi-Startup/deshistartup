# Dependency updates. Kept deliberately low-noise: one grouped npm PR and one
# grouped GitHub Actions PR per week, and security fixes come in on their own.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Asia/Dhaka
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope
    groups:
      # One PR for routine patch/minor bumps; majors still arrive separately
      # so a breaking Next/Nextra upgrade is reviewed on its own.
      dependencies:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      security:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Asia/Dhaka
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns:
          - '*'
