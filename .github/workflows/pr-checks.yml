name: PR checks

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bangla style lint (hard findings fail)
        run: npm run lint:bangla -- --strict

      - name: Media guardrail tests
        run: npm run test:media

      - name: Citation guardrail tests
        run: npm run test:citations

      - name: Build Cloudflare deployment
        run: npm run build:worker
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Validate deployment budgets
        run: npm run check:worker
