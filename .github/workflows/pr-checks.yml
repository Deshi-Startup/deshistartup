name: PR checks

on:
  pull_request:

# Nothing here writes to the repository: read-only token, even if the repo
# default ever loosens.
permissions:
  contents: read

# A new push to the same PR cancels the older run instead of queueing behind it.
concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # Don't make checkout's Git credentials available to the build steps.
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/maps-requirements.txt

      - name: Install map test dependencies
        run: python -m pip install -r scripts/maps-requirements.txt

      - name: Test map importers
        run: npm run test:maps

      - name: Bangla style lint (hard findings fail)
        run: npm run lint:bangla -- --strict

      - name: Run all tests
        run: npm test

      - name: Build Cloudflare deployment
        run: npm run build:worker
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Validate deployment budgets
        run: npm run check:worker
