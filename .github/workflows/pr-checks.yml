name: PR checks

on:
  pull_request:

# Nothing here writes to the repository: read-only token, even if the repo
# default ever loosens.
permissions:
  contents: read

# A new push to the same PR cancels the older run instead of queueing behind it.
concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Don't leave the token in .git/config for the build steps to reach.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bangla style lint (hard findings fail)
        run: npm run lint:bangla -- --strict

      - name: Media guardrail tests
        run: npm run test:media

      - name: Citation guardrail tests
        run: npm run test:citations

      - name: Build Cloudflare deployment
        run: npm run build:worker
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Validate deployment budgets
        run: npm run check:worker
