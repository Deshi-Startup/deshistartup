name: Refresh contributors

on:
  schedule:
    # Every day at 04:00 UTC
    - cron: '0 4 * * *'
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

concurrency:
  group: refresh-contributors
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    # The built-in GITHUB_TOKEN needs write access to push the updated snapshot.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh contributor snapshot
        run: npm run contributors:refresh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push if changed
        run: |
          git diff --quiet app/generated/contributors.json && exit 0
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/generated/contributors.json
          git commit -m "chore: refresh contributor snapshot"
          git push
