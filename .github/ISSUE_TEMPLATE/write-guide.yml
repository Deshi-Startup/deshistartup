name: "✍️ একটি গাইড লিখতে চাই · I want to write a guide"
description: "একটি 'লেখা বাকি' বিষয় নিজের নামে নিন, যাতে দুজন একই লেখা শুরু না করেন। · Claim an unwritten topic so two people do not duplicate work."
title: "গাইড: "
labels: ["নতুন গাইড", "claimed"]
body:
  - type: markdown
    attributes:
      value: |
        [লেখা বাকি বিষয়](https://deshistartup.com/guides) থেকে একটি বেছে নিন। লেখা শুরুর আগে
        [অবদান রাখার সংক্ষিপ্ত নির্দেশিকা](https://github.com/Deshi-Startup/deshistartup/blob/main/CONTRIBUTING.md)
        দেখে নিলে রিসার্চ, গঠন ও রিভিউয়ের নিয়ম এক জায়গায় পাবেন।
  - type: input
    id: topic
    attributes:
      label: "কোন বিষয়টি লিখবেন? · Which topic will you write?"
      description: "লেখা বাকি পাতার লিংক বা ব্যাকলগে থাকা বিষয়ের নাম দিন। · Link to the unwritten page, or give the topic name from the backlog."
      placeholder: "https://deshistartup.com/registration/..."
    validations:
      required: true
  - type: textarea
    id: experience
    attributes:
      label: "বিষয়টা আপনি কীভাবে জানেন? · How do you know this topic?"
      description: "নিজে কাজটি করেছেন, পেশাগতভাবে জানেন, নাকি রিসার্চ করে লিখবেন? এক-দুই লাইনই যথেষ্ট। · Did you do it yourself, know it professionally, or plan to research it? A line or two is enough."
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: "কোন সূত্র ব্যবহার করবেন? (জানলে) · Which sources will you use? (if known)"
      description: "সরকারি বা মূল সূত্র আগে ব্যবহার করুন। দরকার হলে `plan/sources.csv`-এর তালিকা দেখুন। · Start with official or primary sources. Use the list in `plan/sources.csv` if helpful."
    validations:
      required: false
  - type: checkboxes
    id: rules
    attributes:
      label: "লেখার মূল নিয়ম · Ground rules"
      options:
        - label: "বাংলায় ভেবে স্বাভাবিক বাংলায় লিখব, ইংরেজি খসড়া অনুবাদ করব না · I will write the Bengali source directly in natural Bangla, not translate an English draft"
          required: true
        - label: "আইন, ফি ও নিয়মের দাবিতে সূত্র দেব, আর অনুমানকে তথ্য বানাব না · I will source legal, fee and regulatory claims, and will not present guesses as facts"
          required: true
